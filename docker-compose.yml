services:
  9router:
    build:
      context: .
      dockerfile: Dockerfile
    image: 9router:latest
    container_name: 9router
    restart: always

    volumes:
      - 9router-data:/app/data

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787

    depends_on:
      - headroom

    networks:
      - default
      - gateway

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always

    networks:
      - default

volumes:
  9router-data:
    name: 9router-data

networks:
  gateway:
    name: caddy-net
    external: true
