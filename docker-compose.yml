services:
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        echo "[startup] Updating npm and 9router to latest..."
        npm install -g npm@latest --prefer-online || true
        npm i -g 9router@latest --prefer-online || true
        chmod -R a+rx /usr/local/lib/node_modules /usr/local/bin 2>/dev/null || true
        if [ -f /entrypoint.sh ]; then
          exec /entrypoint.sh node custom-server.js
        else
          exec node custom-server.js
        fi

    volumes:
      - 9router-data:/app/data

    env_file:
      - .env

    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787

    depends_on:
      - headroom

    networks:
      - default
      - gateway

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always

    networks:
      - default

volumes:
  9router-data:
    name: 9router-data

networks:
  gateway:
    name: caddy-net
    external: true
